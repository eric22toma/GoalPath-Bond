name: Temporary main-only Run-arrow verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-test-simplified-main.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy scikit-learn gurobipy
      - name: Check all four Python scripts compile
        run: python -m py_compile process_investable_universe.py elastic_net_one_period.py prepare_stage1_inputs.py robust_mvo_one_period.py
      - name: Run simplified elastic-net main
        run: python elastic_net_one_period.py
      - name: Check forecast handoff is compatible with staging and optimizer
        run: |
          python - <<'PY'
          import pandas as pd
          from elastic_net_one_period import DEFAULT_FORECAST_BUNDLE
          bundle = pd.read_pickle(DEFAULT_FORECAST_BUNDLE)
          assert bundle['asof'] == '2025-10'
          assert bundle['target_month'] == '2025-11'
          assert len(bundle['snapshot']) > 100
          print('SIMPLIFIED MAIN TEST:',bundle['asof'],'to',bundle['target_month'],len(bundle['snapshot']),'forecasts')
          PY
          python prepare_stage1_inputs.py
          python robust_mvo_one_period.py
