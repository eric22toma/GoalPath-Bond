name: One-time publish shared Stage 1 inputs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-stage1-inputs.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy scipy scikit-learn gurobipy
      - name: Stage from the committed shared elastic-net forecasts
        run: python prepare_stage1_inputs.py
      - name: Verify all six outputs and optimized Stage 1 handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d=Path("stage1_outputs/inputs")
          names=["stage1_inputs.pkl","eligible_inputs.csv","candidate_inputs.csv",
                 "candidate_covariance.csv","factor_covariance.csv","stage1_report.json"]
          for name in names:
              p=d/name
              assert p.is_file() and p.stat().st_size>0, f"Missing output: {p}"
              print("STAGING ARTIFACT",name,p.stat().st_size,"bytes")
          stage=pd.read_pickle(d/"stage1_inputs.pkl")
          assert len(stage["eligible"])>1000
          assert len(stage["candidates"])==20
          assert abs(stage["eligible"].benchmark_weight.sum()-1)<1e-8
          assert stage["pretrade_cash_weight"]==1.0
          report=json.loads((d/"stage1_report.json").read_text())
          assert report["asof"]==stage["asof"]
          print("STAGE 1 VERIFIED",stage["asof"],stage["target_month"],
                len(stage["eligible"]),"eligible",len(stage["candidates"]),"candidates")
          PY
          python robust_mvo_one_period.py
      - name: Commit and publish Stage 1 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage1_outputs/inputs/
          git diff --cached --quiet || git commit -m 'Publish shared Stage 1 benchmark and risk inputs'
          git push origin HEAD:main
