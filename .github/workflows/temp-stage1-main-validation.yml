name: Validate Stage 1 main and publish outputs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-stage1-main-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Configure Git identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Run simplified stage1 main (commits generated inputs)
        run: python prepare_stage1_inputs.py
      - name: Confirm all six outputs exist
        run: |
          for f in stage1_inputs.pkl eligible_inputs.csv candidate_inputs.csv candidate_covariance.csv factor_covariance.csv stage1_report.json; do
            test -s "stage1_outputs/inputs/$f"
          done
          python - <<'PY'
          import pandas as pd, json
          s=pd.read_pickle("stage1_outputs/inputs/stage1_inputs.pkl")
          print("STAGE1-VALIDATION",len(s["eligible"]),len(s["candidates"]),s["asof"])
          print("PSI",s["eligible"].psi.isna().sum(),"NaN")
          print("benchmark",s["eligible"].benchmark_weight.sum())
          print("REPORT",json.loads(open("stage1_outputs/inputs/stage1_report.json").read())["asof"])
          PY
