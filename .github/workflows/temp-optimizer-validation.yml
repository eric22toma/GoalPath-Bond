name: Test saved-input robust MVO
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-optimizer-validation.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas gurobipy
      - run: python -m py_compile robust_mvo_one_period.py
      - name: Run exact optimizer using committed stage inputs
        run: python robust_mvo_one_period.py
      - name: Verify solution and heuristic mode
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from robust_mvo_one_period import load_stage, run_solver, RESULTS_DIR
          r=json.loads((RESULTS_DIR/'stage1_optimization_report.json').read_text())
          p=pd.read_csv(RESULTS_DIR/'portfolio_exact.csv')
          print('TEST exact', r['exact']['holdings_count'], 'objective',r['exact']['objective_value'],
                'sum weights',p.optimized_weight.sum())
          assert p.optimized_weight.sum() > .99999
          assert r['exact']['holdings_count'] <= 5
          assert abs(r['exact']['duration_gap']) <= .50001
          assert np.isfinite(r['exact']['objective_value'])
          s=load_stage()
          print('TEST staged shape',len(s['eligible']),len(s['candidates']))
          try:
              h=run_solver(s,method='heuristic')
              print('TEST heuristic',h['heuristic'][1]['objective_value'])
          except RuntimeError as exc:
              print('TEST heuristic warning:',exc)
          PY
