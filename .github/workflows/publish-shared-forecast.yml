name: Publish shared GoalPath H1 forecast (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-shared-forecast.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline requirements
        run: python -m pip install pandas numpy scipy scikit-learn gurobipy
      - name: Generate H1 forecast from repository data
        run: python elastic_net_one_period.py
      - name: Confirm compressed shared forecast and staging handoff
        run: |
          python - <<'PY'
          import pandas as pd
          from elastic_net_one_period import DEFAULT_FORECAST_BUNDLE
          bundle = pd.read_pickle(DEFAULT_FORECAST_BUNDLE)
          assert DEFAULT_FORECAST_BUNDLE.suffix == '.gz'
          assert len(bundle['snapshot']) > 1000
          assert {'asof','target_month','snapshot','curve_params','history'}.issubset(bundle)
          print('SHARED FORECAST:', bundle['asof'], '->', bundle['target_month'],
                'bonds:',len(bundle['snapshot']),
                'compressed bytes:',DEFAULT_FORECAST_BUNDLE.stat().st_size)
          PY
          python prepare_stage1_inputs.py
          python robust_mvo_one_period.py
      - name: Commit and push only the shared compressed forecast file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage1_outputs/forecasts/elastic_net_outputs.pkl.gz
          git diff --cached --quiet || git commit -m 'Publish reusable compressed H1 forecast for GoalPath team'
          git push origin HEAD:main
