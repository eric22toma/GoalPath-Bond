name: Temporary elastic-net cleanup smoke test

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-check-cleanup.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy scikit-learn gurobipy
      - name: Validate Python syntax
        run: python -m py_compile process_investable_universe.py elastic_net_one_period.py prepare_stage1_inputs.py robust_mvo_one_period.py
      - name: Regenerate H1 forecasts using cleaned code
        run: python elastic_net_one_period.py
      - name: Validate saved bundle and staging optimization
        run: |
          python - <<'PY'
          import pandas as pd
          from elastic_net_one_period import DEFAULT_FORECAST_BUNDLE
          z=pd.read_pickle(DEFAULT_FORECAST_BUNDLE)
          assert len(z['snapshot']) > 500
          assert pd.Period(z['target_month']) == pd.Period(z['asof'])+1
          print('CLEANUP TEST: forecast',z['asof'],'->',z['target_month'],
                'bonds',len(z['snapshot']))
          PY
          python prepare_stage1_inputs.py
          python robust_mvo_one_period.py
