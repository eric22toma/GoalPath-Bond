name: Temporary verification of outstanding amount eligibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-validate-outstanding.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy scikit-learn gurobipy
      - name: Rebuild Stage 1 inputs
        run: python prepare_stage1_inputs.py
      - name: Confirm positive amounts across eligible and candidates
        run: |
          python - <<'PY'
          import pandas as pd
          p="stage1_outputs/inputs/stage1_inputs.pkl"
          stage=pd.read_pickle(p)
          for name in ("eligible","candidates"):
              df=stage[name]
              amounts=pd.to_numeric(df.AMOUNT_OUTSTANDING, errors="coerce")
              assert amounts.notna().all() and amounts.gt(0).all(), f"{name}: invalid outstanding amount!"
              print("CHECK",name,len(df),"positive amounts", "benchmark weight sum",df.benchmark_weight.sum())
          assert abs(stage["eligible"].benchmark_weight.sum()-1)<1e-8
          PY
      - name: Run downstream portfolio optimizer
        run: python robust_mvo_one_period.py
      - name: Commit shared Stage 1 inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage1_outputs/inputs/
          git diff --cached --quiet || git commit -m 'Refresh shared Stage 1 inputs excluding invalid outstanding amounts'
          git push origin HEAD:main
