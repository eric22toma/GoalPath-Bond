name: GoalPath-Bond sequential pipeline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install numpy pandas scipy scikit-learn gurobipy
      - name: Syntax and unit tests
        run: |
          python -m py_compile process_investable_universe.py elastic_net_one_period.py prepare_stage1_inputs.py robust_mvo_one_period.py
          python -m unittest -v test_goalpath_h1 test_stage1
      - name: Data processing (Run arrow 1)
        run: python process_investable_universe.py
      - name: Elastic net forecasts (Run arrow 2, saves handoff)
        run: python elastic_net_one_period.py
      - name: Verify saved H1 forecast bundle and lean history
        run: |
          python - <<'PY'
          import pandas as pd
          from elastic_net_one_period import DEFAULT_FORECAST_BUNDLE
          assert DEFAULT_FORECAST_BUNDLE.is_file(), 'Forecast pickle missing'
          obj = pd.read_pickle(DEFAULT_FORECAST_BUNDLE)
          assert pd.Period(obj['target_month']) == pd.Period(obj['asof']) + 1
          assert len(obj['snapshot']) > 100
          expected = {'cusip','month','RET_EOM','DURATION','time_to_maturity','RATING_NUM'}
          assert set(obj['history'].columns) == expected
          assert len(obj['history']) > len(obj['snapshot'])
          print('FORECAST HANDOFF:',obj['asof'],'->',obj['target_month'],
                len(obj['snapshot']),'bonds;',DEFAULT_FORECAST_BUNDLE.stat().st_size,
                'bytes (no historical backtest required)')
          PY
      - name: Prepare optimization inputs (Run arrow 3, reads saved forecast)
        run: python prepare_stage1_inputs.py
      - name: Optimize one period (Run arrow 4)
        run: python robust_mvo_one_period.py
      - name: Check saved staging and initial funded trade
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d = Path('stage1_outputs')
          inputs = pd.read_pickle(d/'inputs'/'stage1_inputs.pkl')
          from elastic_net_one_period import DEFAULT_FORECAST_BUNDLE
          forecast = pd.read_pickle(DEFAULT_FORECAST_BUNDLE)
          assert inputs['asof'] == forecast['asof']
          assert inputs['target_month'] == forecast['target_month']
          assert inputs['pretrade_cash_weight'] == 1.0
          assert inputs['eligible'].current_weight.eq(0).all()
          assert (d/'inputs'/'candidate_covariance.csv').is_file()
          report = json.loads((d/'results'/'stage1_optimization_report.json').read_text())
          h = report['heuristic']
          assert h['holdings_count'] <= 5
          assert abs(h['duration_gap']) <= 0.50001
          assert abs(h['buy_notional_dollars'] - 100_000) < .10
          assert abs(h['sell_notional_dollars']) < .10
          assert abs(h['transaction_cost_dollars'] - 100) < .10
          print('SEQUENTIAL PIPELINE PASSED:',h['holdings_count'],'bonds; $100 initial buy fees')
          PY
