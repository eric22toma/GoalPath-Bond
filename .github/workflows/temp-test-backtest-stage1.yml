name: Temporary Stage 1 backtest smoke test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-test-backtest-stage1.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy scikit-learn gurobipy
      - run: python -m py_compile backtest_stage1.py
      - name: Run two-month sequential optimization
        run: |
          python - <<'PY'
          import backtest_stage1 as b
          b.START_MONTH = '2025-09'
          b.END_MONTH = '2025-10'
          b.CANDIDATE_COUNT = 20
          b.METHOD = 'exact'
          b.RUN_COMPARISONS = False
          b.main()
          import pandas as pd
          r = pd.read_csv(b.OUTPUT_DIR / 'monthly_results.csv')
          print('TEST monthly metrics', r[['decision_month','target_month','portfolio_return','benchmark_return','one_way_turnover','benchmark_return_coverage']].to_string(index=False))
          assert len(r)==2
          assert r.holdings_count.max() <= 10
          assert (r.benchmark_return_coverage>0).all()
          PY
