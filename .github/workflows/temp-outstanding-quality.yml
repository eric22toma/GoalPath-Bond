name: Temporary outstanding amount data audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-outstanding-quality.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Audit eligible forecast and source data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import zipfile
          b=pd.read_pickle('stage1_outputs/forecasts/elastic_net_outputs.pkl.gz')
          now=b['snapshot']
          mask=(now.time_to_maturity.ge(1) & now.DURATION.gt(0) &
                now.YIELD.notna() & now.predicted_dy_pp.notna() & now.PRICE_EOM.gt(0))
          def summarize(tag, x):
              a=pd.to_numeric(x,errors='coerce')
              print('AUDIT',tag,'total',len(a),'missing',int(a.isna().sum()),
                    'zero',int(a.eq(0).sum()),'negative',int(a.lt(0).sum()),
                    'positive',int(a.gt(0).sum()))
          summarize('ASOF '+str(b['asof'])+' FORECAST', now.AMOUNT_OUTSTANDING)
          eligible=now.loc[mask]
          summarize('ASOF ELIGIBLE',eligible.AMOUNT_OUTSTANDING)
          bad=eligible[pd.to_numeric(eligible.AMOUNT_OUTSTANDING,errors='coerce').isna() |
                       pd.to_numeric(eligible.AMOUNT_OUTSTANDING,errors='coerce').le(0)]
          print('AUDIT eligible zero-weight CUSIPs:',bad.cusip.head(10).tolist())
          zpath=Path('01_Source_Data/Investable_universe_AGG.csv.zip')
          with zipfile.ZipFile(zpath) as zf:
              members=[n for n in zf.namelist() if n.lower().endswith('.csv')]
              print('AUDIT source CSV members:',members)
              n=0;miss=0;zero=0;neg=0;pos=0
              for chunk in pd.read_csv(zf.open(members[0]), usecols=lambda x: x=='AMOUNT_OUTSTANDING', chunksize=250000):
                  a=pd.to_numeric(chunk.AMOUNT_OUTSTANDING,errors='coerce')
                  n+=len(a);miss+=int(a.isna().sum());zero+=int(a.eq(0).sum());neg+=int(a.lt(0).sum());pos+=int(a.gt(0).sum())
              print('AUDIT SOURCE ALL ROWS total',n,'missing',miss,'zero',zero,'negative',neg,'positive',pos)
          PY
