name: Temporary verify repaired GoalPath main and output
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-verify-main-repair.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy scikit-learn gurobipy
      - name: Compile all active Python scripts
        run: python -m py_compile process_investable_universe.py elastic_net_one_period.py prepare_stage1_inputs.py robust_mvo_one_period.py
      - name: Run repaired model and capture familiar output
        run: |
          python elastic_net_one_period.py | tee /tmp/elastic_run.log
          grep -q "Five best elastic-net settings" /tmp/elastic_run.log
          grep -q "ALL-BOND EVALUATION (unscreened)" /tmp/elastic_run.log
          grep -q "Stage 1 forecasts saved to" /tmp/elastic_run.log
      - name: Verify forecast bundle and downstream Stage 1
        run: |
          python - <<'PY'
          import pandas as pd
          from elastic_net_one_period import DEFAULT_FORECAST_BUNDLE
          bundle=pd.read_pickle(DEFAULT_FORECAST_BUNDLE)
          assert bundle['asof']=='2025-10'
          assert bundle['target_month']=='2025-11'
          assert len(bundle['snapshot']) > 500
          print('SAVED FORECAST:',bundle['asof'],bundle['target_month'],len(bundle['snapshot']))
          PY
          python prepare_stage1_inputs.py
          python robust_mvo_one_period.py
